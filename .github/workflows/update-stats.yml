# Daily NBA stats refresh: fetches the current season (2026-27) from
# stats.nba.com and stores it in Supabase via supabase_quick_start.py.
#
# Requires repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL     - https://<project>.supabase.co
#   SUPABASE_KEY     - anon/public key
#   NBA_API_PROXY    - optional proxy for stats.nba.com (cloud IPs are blocked)
#
# Runs daily at 06:00 UTC and can also be triggered manually.

name: Update NBA Stats

on:
  schedule:
    - cron: "0 6 * * *" # every day, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-nba-stats
  cancel-in-progress: false

jobs:
  update:
    name: Fetch and store season stats
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # supabase + dotenv are not project deps; installed only for this job
          python -m pip install supabase python-dotenv

      - name: Fetch and store stats in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Optional; empty means a direct request. cloud IPs are often blocked
          # by stats.nba.com, so set this secret to a working proxy.
          NBA_API_PROXY: ${{ secrets.NBA_API_PROXY }}
          PYTHONUNBUFFERED: "1"
        run: python supabase_quick_start.py
